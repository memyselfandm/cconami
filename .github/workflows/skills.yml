name: skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # check-versions.py needs the base branch and the merge base
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: Validate the marketplace and each plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do
            claude plugin validate "$plugin"
          done
      - name: Check the README catalog against the marketplace
        run: python3 scripts/check-catalog.py
      - name: Test the catalog check
        run: bash scripts/test-check-catalog.sh
      - name: Check that changed plugins bumped their version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-versions.py --base "origin/$BASE_REF"
      - name: Test the version check
        run: bash scripts/test-check-versions.sh
      - name: Run each mod's tests
        run: |
          failed=0
          for plugin in plugins/*/; do
            if [ -n "$(find "$plugin" \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit)" ]; then
              claude plugin test "$plugin" || failed=1
            fi
          done
          exit "$failed"
      - name: Mutation check for guardrail-notice
        run: bash plugins/guardrail-notice/tests/mutation-check.sh
      - name: Mutation check for omc-watchdog
        run: bash plugins/omc-watchdog/tests/mutation-check.sh
      - name: Mutation check for omc-launcher
        run: bash plugins/omc-launcher/tests/mutation-check.sh
      - name: Lint SKILL.md files
        run: uv run --script scripts/lint-skills.py
      - name: Test the lint
        run: bash scripts/test-lint-skills.sh
      - name: Test the Hermes renderer
        run: bash platforms/hermes/test-render.sh
      - name: Test the operating-model command guard
        run: |
          python3 -m json.tool plugins/operating-model/hooks/hooks.json >/dev/null
          python3 -m json.tool plugins/operating-model/hooks/guard-rules.json >/dev/null
          grep -q 'guard-bash-command.py' plugins/operating-model/hooks/hooks.json
          bash plugins/operating-model/hooks/test-guard-bash-command.sh
      - name: Render every skill for Hermes (dry run)
        run: bash platforms/hermes/install.sh --dry-run "$RUNNER_TEMP/hermes"
