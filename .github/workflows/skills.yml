name: skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: Validate the marketplace and each plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do
            claude plugin validate "$plugin"
          done
      - name: Run each mod's tests
        run: |
          failed=0
          for plugin in plugins/*/; do
            if [ -n "$(find "$plugin" \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit)" ]; then
              claude plugin test "$plugin" || failed=1
            fi
          done
          exit "$failed"
      - name: Lint SKILL.md files
        run: uv run --script scripts/lint-skills.py
      - name: Test the lint
        run: bash scripts/test-lint-skills.sh
      - name: Test the Hermes renderer
        run: bash platforms/hermes/test-render.sh
      - name: Test the operating-model command guard
        run: |
          python3 -m json.tool plugins/operating-model/hooks/hooks.json >/dev/null
          python3 -m json.tool plugins/operating-model/hooks/guard-rules.json >/dev/null
          grep -q 'guard-bash-command.py' plugins/operating-model/hooks/hooks.json
          bash plugins/operating-model/hooks/test-guard-bash-command.sh
      - name: Render every skill for Hermes (dry run)
        run: bash platforms/hermes/install.sh --dry-run "$RUNNER_TEMP/hermes"
